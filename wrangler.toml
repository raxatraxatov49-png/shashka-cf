name = "shashka-cf"
main = "cf/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/telegram-webhook", "/health", "/_debug", "/app.js"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
WEBHOOK_URL = "https://shashka-cf.raxatarzubaev.workers.dev/telegram-webhook"
MINI_APP_URL = "https://shashka-cf.raxatarzubaev.workers.dev"
