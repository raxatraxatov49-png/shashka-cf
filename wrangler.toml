name = "shashka-cf"
main = "cf/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
run_worker_first = ["/ws", "/telegram-webhook", "/health"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# ---- СЫНАҚ РЕЖИМІ: нағыз ботқа әсер етпейді. Көшіруге дайын болғанда README-дегі "Көшу" бөлімін орында ----
[vars]
DEV = "1"
SKIP_WEBHOOK = "1"
REDIS_PREFIX = "shashka-test:"
WEBHOOK_URL = "https://shashka-cf.raxatarzubaev.workers.dev/telegram-webhook"
MINI_APP_URL = "https://shashka-cf.raxatarzubaev.workers.dev"
